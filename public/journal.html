<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal | Pet Parent</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header header-app">
    <div class="container">
      <a href="/dashboard.html" class="logo">
        <span class="logo-icon">🐾</span>
        Pet Parent
      </a>
      <nav class="nav nav-app">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/pets.html" class="nav-link">My Pets</a>
        <a href="/history.html" class="nav-link">History</a>
        <a href="/journal.html" class="nav-link active">Journal</a>
        <a href="/vets.html" class="nav-link">Find Vets</a>
        <a href="/chat.html" class="nav-link">Pet Chat</a>
        <button class="btn btn-secondary btn-small" id="logout-btn">Log Out</button>
      </nav>
      <button class="mobile-menu-btn" id="mobile-menu-btn">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <nav class="mobile-nav" id="mobile-nav">
    <a href="/dashboard.html" class="nav-link">Dashboard</a>
    <a href="/pets.html" class="nav-link">My Pets</a>
    <a href="/history.html" class="nav-link">History</a>
    <a href="/journal.html" class="nav-link active">Journal</a>
    <a href="/vets.html" class="nav-link">Find Vets</a>
    <a href="/chat.html" class="nav-link">Pet Chat</a>
    <button class="btn btn-secondary btn-full" id="mobile-logout-btn">Log Out</button>
  </nav>

  <main class="page-content">
    <div class="container">
      <div class="page-header">
        <h1>Pet Journal</h1>
        <button class="btn btn-primary" id="new-entry-btn">+ New Entry</button>
      </div>

      <div class="filters">
        <div class="filter-group">
          <label for="filter-pet">Pet</label>
          <select id="filter-pet">
            <option value="">All Pets</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-type">Type</label>
          <select id="filter-type">
            <option value="">All Types</option>
            <option value="note">General Note</option>
            <option value="symptom">Symptom</option>
            <option value="medication">Medication</option>
            <option value="vet_visit">Vet Visit</option>
            <option value="weight">Weight</option>
            <option value="food">Food</option>
            <option value="behavior">Behavior</option>
          </select>
        </div>
      </div>

      <div class="journal-list journal-list-full" id="journal-list">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Loading journal entries...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- New/Edit Entry Modal -->
  <div class="modal" id="entry-modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">New Journal Entry</h2>
        <button class="modal-close" id="close-modal">&times;</button>
      </div>
      <form id="entry-form" class="form">
        <input type="hidden" id="entry-id">
        <div class="form-group">
          <label for="entry-pet">Pet *</label>
          <select id="entry-pet" required>
            <option value="">Select pet...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="entry-type">Entry Type *</label>
          <select id="entry-type" required>
            <option value="note">General Note</option>
            <option value="symptom">Symptom</option>
            <option value="medication">Medication</option>
            <option value="vet_visit">Vet Visit</option>
            <option value="weight">Weight</option>
            <option value="food">Food</option>
            <option value="behavior">Behavior</option>
          </select>
        </div>
        <div class="form-group">
          <label for="entry-date">Date</label>
          <input type="date" id="entry-date">
        </div>
        <div class="form-group">
          <label for="entry-title">Title</label>
          <input type="text" id="entry-title" placeholder="Brief summary...">
        </div>
        <div class="form-group">
          <label for="entry-content">Details</label>
          <textarea id="entry-content" rows="4" placeholder="Describe what happened..."></textarea>
        </div>

        <div class="form-group">
          <label>Photo Attachment</label>
          <div class="photo-upload-area photo-upload-small" id="journal-photo-area">
            <div class="photo-preview" id="journal-photo-preview">
              <span class="photo-placeholder">📷</span>
              <span>Attach Photo</span>
            </div>
            <input type="file" id="journal-photo-input" accept="image/*" style="display: none;">
          </div>
        </div>

        <!-- Type-specific fields -->
        <div id="weight-fields" class="type-fields" style="display: none;">
          <div class="form-group">
            <label for="weight-value">Weight (kg)</label>
            <input type="number" id="weight-value" step="0.1" min="0">
          </div>
        </div>

        <div id="medication-fields" class="type-fields" style="display: none;">
          <div class="form-group">
            <label for="medication-name">Medication Name</label>
            <input type="text" id="medication-name">
          </div>
          <div class="form-group">
            <label for="medication-dose">Dosage</label>
            <input type="text" id="medication-dose" placeholder="e.g., 10mg twice daily">
          </div>
        </div>

        <div class="form-error" id="entry-form-error"></div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancel-entry">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Entry</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal" id="delete-modal">
    <div class="modal-overlay"></div>
    <div class="modal-content modal-small">
      <div class="modal-header">
        <h2>Delete Entry</h2>
        <button class="modal-close" id="close-delete-modal">&times;</button>
      </div>
      <p>Are you sure you want to delete this journal entry? This action cannot be undone.</p>
      <div class="form-actions">
        <button class="btn btn-secondary" id="cancel-delete">Cancel</button>
        <button class="btn btn-danger" id="confirm-delete">Delete</button>
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/journal.js"></script>
</body>
</html>
