<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Pet | Pet Parent</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header header-app">
    <div class="container">
      <a href="/dashboard.html" class="logo">
        <span class="logo-icon">🐾</span>
        Pet Parent
      </a>
      <nav class="nav nav-app">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/pets.html" class="nav-link active">My Pets</a>
        <a href="/history.html" class="nav-link">History</a>
        <a href="/journal.html" class="nav-link">Journal</a>
        <a href="/vets.html" class="nav-link">Find Vets</a>
        <a href="/chat.html" class="nav-link">Pet Chat</a>
        <button class="btn btn-secondary btn-small" id="logout-btn">Log Out</button>
      </nav>
      <button class="mobile-menu-btn" id="mobile-menu-btn">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <nav class="mobile-nav" id="mobile-nav">
    <a href="/dashboard.html" class="nav-link">Dashboard</a>
    <a href="/pets.html" class="nav-link active">My Pets</a>
    <a href="/history.html" class="nav-link">History</a>
    <a href="/journal.html" class="nav-link">Journal</a>
    <a href="/vets.html" class="nav-link">Find Vets</a>
    <a href="/chat.html" class="nav-link">Pet Chat</a>
    <button class="btn btn-secondary btn-full" id="mobile-logout-btn">Log Out</button>
  </nav>

  <main class="page-content">
    <div class="container container-small">
      <div class="page-header">
        <a href="/pets.html" class="back-link">&larr; Back to Pets</a>
        <h1>Add a Pet</h1>
      </div>

      <form id="pet-form" class="form card">
        <div class="photo-upload-area" id="photo-upload-area">
          <div class="photo-preview" id="photo-preview">
            <span class="photo-placeholder">📷</span>
            <span>Add Pet Photo</span>
          </div>
          <input type="file" id="photo-input" accept="image/*" style="display: none;">
        </div>

        <div class="form-group">
          <label for="name">Pet's Name *</label>
          <input type="text" id="name" name="name" required placeholder="e.g., Max, Luna">
        </div>

        <div class="form-group">
          <label for="species">Species *</label>
          <div class="species-select">
            <label class="species-option">
              <input type="radio" name="species" value="dog" required>
              <span class="species-card">
                <span class="species-icon">🐕</span>
                <span>Dog</span>
              </span>
            </label>
            <label class="species-option">
              <input type="radio" name="species" value="cat">
              <span class="species-card">
                <span class="species-icon">🐈</span>
                <span>Cat</span>
              </span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="breed">Breed</label>
          <input type="text" id="breed" name="breed" placeholder="e.g., Golden Retriever, Siamese">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="age_years">Age (Years)</label>
            <input type="number" id="age_years" name="age_years" min="0" max="30" placeholder="0">
          </div>
          <div class="form-group">
            <label for="age_months">Age (Months)</label>
            <input type="number" id="age_months" name="age_months" min="0" max="11" placeholder="0">
          </div>
        </div>

        <div class="form-group">
          <label for="weight">Weight (kg)</label>
          <input type="number" id="weight" name="weight_kg" min="0" step="0.1" placeholder="e.g., 10.5">
        </div>

        <div class="form-group">
          <label for="conditions">Known Conditions</label>
          <textarea id="conditions" name="known_conditions" placeholder="e.g., allergies, diabetes, arthritis (separate with commas)"></textarea>
          <span class="form-hint">Any existing health conditions your pet has</span>
        </div>

        <div class="form-group">
          <label for="medications">Current Medications</label>
          <textarea id="medications" name="medications" placeholder="e.g., insulin, joint supplements (separate with commas)"></textarea>
          <span class="form-hint">Any medications your pet is currently taking</span>
        </div>

        <div class="additional-details-section">
          <button type="button" class="additional-details-toggle" id="toggle-details">
            Additional Details (optional) <span class="toggle-icon">▼</span>
          </button>
          <div class="additional-details-content" id="additional-details" style="display: none;">
            <div class="form-group">
              <label for="diet">Diet</label>
              <select id="diet" name="diet">
                <option value="">Select diet type...</option>
                <option value="dry">Dry Food</option>
                <option value="wet">Wet Food</option>
                <option value="raw">Raw Diet</option>
                <option value="mixed">Mixed</option>
                <option value="prescription">Prescription Diet</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label>Spayed/Neutered</label>
              <div class="radio-group">
                <label class="radio-option">
                  <input type="radio" name="is_fixed" value="yes"> Yes
                </label>
                <label class="radio-option">
                  <input type="radio" name="is_fixed" value="no"> No
                </label>
                <label class="radio-option">
                  <input type="radio" name="is_fixed" value="unknown" checked> Unknown
                </label>
              </div>
            </div>

            <div class="form-group">
              <label for="last_vet_visit">Last Vet Visit</label>
              <input type="date" id="last_vet_visit" name="last_vet_visit">
            </div>

            <div class="form-group">
              <label for="recent_vaccines">Recent Vaccines</label>
              <textarea id="recent_vaccines" name="recent_vaccines" placeholder="e.g., Rabies (Jan 2026), DHPP (Mar 2025)"></textarea>
            </div>

            <div class="form-group">
              <label>Indoor/Outdoor</label>
              <div class="radio-group">
                <label class="radio-option">
                  <input type="radio" name="indoor_outdoor" value="indoor" checked> Indoor
                </label>
                <label class="radio-option">
                  <input type="radio" name="indoor_outdoor" value="outdoor"> Outdoor
                </label>
                <label class="radio-option">
                  <input type="radio" name="indoor_outdoor" value="both"> Both
                </label>
              </div>
            </div>

            <div class="form-group">
              <label for="supplements">Supplements</label>
              <textarea id="supplements" name="supplements" placeholder="e.g., Fish oil, Probiotics"></textarea>
            </div>

            <div class="form-group">
              <label for="travel_history">Travel History</label>
              <textarea id="travel_history" name="travel_history" placeholder="Recent travel or boarding"></textarea>
            </div>

            <div class="form-group">
              <label for="recent_procedures">Recent Procedures</label>
              <textarea id="recent_procedures" name="recent_procedures" placeholder="e.g., Dental cleaning, Surgery"></textarea>
            </div>
          </div>
        </div>

        <div class="form-error" id="form-error"></div>

        <div class="form-actions">
          <a href="/pets.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary" id="submit-btn">
            <span class="btn-text">Add Pet</span>
            <span class="btn-loading" style="display: none;">Adding...</span>
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/add-pet.js"></script>
</body>
</html>
