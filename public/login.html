<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Pet Parent</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <a href="/" class="auth-logo">
        <span class="logo-icon">🐾</span>
        Pet Parent
      </a>
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">Sign in to check on your pet's health</p>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Your password">
        </div>
        <div class="form-error" id="form-error"></div>
        <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
          <span class="btn-text">Log In</span>
          <span class="btn-loading" style="display: none;">Logging in...</span>
        </button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="/signup.html">Sign up</a></p>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
