<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History | PetVital</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header header-app">
    <div class="container">
      <a href="/dashboard.html" class="logo">
        <span class="logo-icon">🐾</span>
        PetVital
      </a>
      <nav class="nav nav-app">
        <a href="/dashboard.html" class="nav-link">Dashboard</a>
        <a href="/pets.html" class="nav-link">My Pets</a>
        <a href="/history.html" class="nav-link active">History</a>
        <a href="/journal.html" class="nav-link">Journal</a>
        <a href="/vets.html" class="nav-link">Find Vets</a>
        <button class="btn btn-secondary btn-small" id="logout-btn">Log Out</button>
      </nav>
      <button class="mobile-menu-btn" id="mobile-menu-btn">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <nav class="mobile-nav" id="mobile-nav">
    <a href="/dashboard.html" class="nav-link">Dashboard</a>
    <a href="/pets.html" class="nav-link">My Pets</a>
    <a href="/history.html" class="nav-link active">History</a>
    <a href="/journal.html" class="nav-link">Journal</a>
    <a href="/vets.html" class="nav-link">Find Vets</a>
    <button class="btn btn-secondary btn-full" id="mobile-logout-btn">Log Out</button>
  </nav>

  <main class="page-content">
    <div class="container">
      <div class="page-header">
        <h1>Symptom Check History</h1>
        <a href="/triage.html" class="btn btn-primary">New Check</a>
      </div>

      <div class="filters">
        <div class="filter-group">
          <label for="filter-pet">Pet</label>
          <select id="filter-pet">
            <option value="">All Pets</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-urgency">Urgency</label>
          <select id="filter-urgency">
            <option value="">All</option>
            <option value="emergency">Emergency</option>
            <option value="urgent">Urgent</option>
            <option value="soon">Soon</option>
            <option value="monitor">Monitor</option>
          </select>
        </div>
      </div>

      <div class="history-list history-list-full" id="history-list">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Loading history...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- History Detail Modal -->
  <div class="modal" id="history-modal">
    <div class="modal-overlay"></div>
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h2>Symptom Check Details</h2>
        <button class="modal-close" id="close-modal">&times;</button>
      </div>
      <div id="history-detail">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/history.js"></script>
</body>
</html>
